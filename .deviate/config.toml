# Preset config group: "default", "full", "fast", or "secure"
profile = "default"
# CLI inactivity timeout in seconds (must be > 0)
timeout_seconds = 1800
# Agent export mode: "local" (project) or "global" (~/.claude/)
agent_export_mode = "local"
# Enable the libref CLI for offline documentation lookups
use_libref = true
# Trunk branch for worktrees, PR base, and review diffs
base_branch = "main"
# Push the claim branch as a distributed lock (default true)
claim_remote = true

# Agent backend configuration

[agent]
backend = "pi"
timeout = 600
pi_rpc = false
transport = "rpc"
